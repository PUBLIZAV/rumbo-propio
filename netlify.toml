[build]
  publish = "."
  command = "echo 'Rumbo Propio static PWA ready for Netlify'"

# Ensure Service Worker is always fresh so offline updates propagate immediately
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json; charset=UTF-8"

# Allow GPS Geolocation, Camera (Passport Scanner), and Microphone/Audio
[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "geolocation=(self), camera=(self), vibrate=(self)"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
